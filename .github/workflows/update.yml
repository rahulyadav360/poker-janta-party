# Finds our PokerNow tables and publishes them: every 10 minutes in the evening (17:30 to 03:30
# IST), hourly otherwise. A new table you own gets the host assistant straight away (join and
# rebuy requests by the house rules, table chat kept). While a table is being played the site is
# republished every 5 minutes; an hour after the last hand the game is checked and the final
# results published. Code and game data live in the private repo rahulyadav360/poker-data.
# Start it by hand (Actions > Update results > Run workflow) to follow a table right away.
name: Update results

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "*/10 12-21 * * *"   # UTC: 17:30 to 03:30 IST
  workflow_dispatch:
    inputs:
      game:
        description: "PokerNow game link (optional: follow this table now)"
        required: false
        default: ""
      republish:
        description: "Rebuild and publish the site now (e.g. after a player merge)"
        type: boolean
        default: false

permissions:
  contents: write   # push the rebuilt site to this repo
  pages: write      # ask GitHub Pages to rebuild

concurrency:
  group: poker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          path: site-repo

      - name: Check out the data (private)
        uses: actions/checkout@v4
        with:
          repository: rahulyadav360/poker-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the socket client (host assistant)
        run: pip install --quiet "python-socketio[client]==4.6.1" python-engineio==3.14.2 websocket-client==1.8.0

      - name: Follow and publish
        working-directory: data
        env:
          POKERNOW_COOKIE: ${{ secrets.POKERNOW_COOKIE }}
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
          REPUBLISH: ${{ inputs.republish && '--republish' || '' }}
        run: |
          for repo in . ../site-repo; do
            git -C "$repo" config user.name "poker-janta-party bot"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done
          python scripts/cloud_update.py --site ../site-repo $REPUBLISH ${GAME:+"$GAME"}
